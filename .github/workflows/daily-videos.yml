name: AI Wala daily videos

on:
  # No GitHub 'schedule' here: runs are started on time by cron-job.org
  # (GitHub's own schedule is often late or skipped).
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even outside the 3 daily slots"
        type: boolean
        default: false
      what:
        description: "What to make"
        type: choice
        options: ["1 Short only", "daily plan (5 Shorts)"]
        default: "1 Short only"
      topic:
        description: "Optional story idea (leave empty for a random one)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ai-wala-daily
  cancel-in-progress: false

jobs:
  # 3 videos a day. cron-job.org may still call more often; runs outside
  # these Malaysia-time slots (5:45pm, 8:45pm, 12:45am) stop here in a few seconds.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.slot.outputs.go }}
    steps:
      - id: slot
        run: |
          H=$(TZ=Asia/Kuala_Lumpur date -d '-20 min' +%H)
          GO=0
          for S in 17 20 00; do [ "$H" = "$S" ] && GO=1; done
          [ "${{ inputs.force }}" = "true" ] && GO=1
          echo "slot hour $H -> go=$GO"
          echo "go=$GO" >> "$GITHUB_OUTPUT"

  make-and-upload:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Kuala_Lumpur
      FFMPEG_PATH: ffmpeg
      # ----- Settings (edit here) -----
      SHORTS_PER_RUN: "1"
      SHORT_SCENES: "10"
      # unique pictures per video (each used for 1-2 scenes) - keeps many videos/day inside the free image limit
      IMAGES_PER_VIDEO: "7"
      PRIVACY: public
      GEMINI_TEXT_MODEL: gemini-3.8-flash
      GEMINI_TTS_MODEL: gemini-3.8-flash-tts
      # The voice AI Wala has always used
      GEMINI_TTS_VOICE: Kore
      # urdu = the voice reads Urdu script, captions show Roman Urdu
      VOICE_SCRIPT: urdu
      BRAND_TEXT: AI WALA
      AMBIENCE_VOLUME: "0.06"
      VOICE_PITCH: "0.94"
      VOICE_REVERB: "0.22"
      PYTHON: python
      # speech recogniser that finds every word's time (multilingual, so it can listen to Urdu).
      # Its result is only used when it agrees with the pauses in the voice; otherwise the pauses are used.
      WHISPER_MODEL: small
      WHISPER_LANGUAGE: ur
      # ----- Secrets (Settings -> Secrets and variables -> Actions) -----
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      # optional backup Cloudflare account (used when the first one's daily limit is reached)
      CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
      CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install word-timing tool (makes captions match the voice)
        run: pip install -q faster-whisper==1.1.1

      - name: Reuse the speech model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-ur-v1

      - name: Make and upload a Short
        env:
          TOPIC: ${{ github.event.inputs.topic }}
          WHAT: ${{ github.event.inputs.what }}
        run: |
          COUNT=1
          if [ "$WHAT" = "daily plan (5 Shorts)" ]; then COUNT=5; fi
          if [ -n "$TOPIC" ]; then node make-video.js --count "$COUNT" --topic "$TOPIC"; else node make-video.js --count "$COUNT"; fi

      - name: Save story history (so stories never repeat)
        if: always()
        run: |
          if [ -f history.json ]; then
            git config user.name "ai-wala-bot"
            git config user.email "ai-wala-bot@users.noreply.github.com"
            git add history.json
            git commit -m "Update story history $(date +'%Y-%m-%d %H:%M')" || echo "Nothing to save"
            git pull --rebase || true
            git push || echo "Could not save history"
          fi

      - name: Keep the video for 2 days (download from this page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            output/*/final.mp4
            output/*/story.json
            logs/pipeline.log
          retention-days: 2
          if-no-files-found: ignore
