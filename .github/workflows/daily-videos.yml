name: AI Wala daily videos

on:
  # No GitHub 'schedule' here: runs are started on time by cron-job.org
  # (GitHub's own schedule is often late or skipped).
  workflow_dispatch:
    inputs:
      what:
        description: "What to make"
        type: choice
        options: ["daily plan (5 Shorts)", "1 Short only", "1 long video only"]
        default: "daily plan (5 Shorts)"

permissions:
  contents: write

concurrency:
  group: ai-wala-daily
  cancel-in-progress: false

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Kuala_Lumpur
      FFMPEG_PATH: ffmpeg
      # ----- Settings (edit here) -----
      LONGS_PER_RUN: "0"
      SHORTS_PER_RUN: "5"
      # "none" = go public right after upload (no scheduling)
      LONG_PUBLISH_HOURS: "none"
      SHORT_PUBLISH_HOURS: "none"
      LONG_SCENES: "32"
      SHORT_SCENES: "6"
      PRIVACY: public
      GEMINI_TEXT_MODEL: gemini-3.8-flash
      GEMINI_TTS_MODEL: gemini-3.8-flash-tts
      GEMINI_TTS_VOICE: Kore
      VOICE_SCRIPT: urdu
      BRAND_TEXT: AI WALA
      MUSIC_VOLUME: "0.10"
      # ----- Secrets (Settings -> Secrets and variables -> Actions) -----
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation > /dev/null
          ffmpeg -version | head -1

      - name: Check keys (safe preview, first and last 4 characters only)
        run: node keys-preview.js

      - name: Make and upload videos
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node make-video.js --count 1
          else
            case "${{ github.event.inputs.what }}" in
              "1 Short only") node make-video.js --count 1 ;;
              "1 long video only") node make-video.js --long ;;
              *) node make-video.js ;;
            esac
          fi

      - name: Save story history (so stories never repeat)
        if: always()
        run: |
          if [ -f history.json ]; then
            git config user.name "ai-wala-bot"
            git config user.email "ai-wala-bot@users.noreply.github.com"
            git add history.json
            git commit -m "Update story history $(date +'%Y-%m-%d')" || echo "Nothing to save"
            git push || echo "Could not save history"
          fi

      - name: Keep the videos for 2 days (download from this page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            output/*/final.mp4
            output/*/thumbnail.jpg
            logs/pipeline.log
          retention-days: 2
          if-no-files-found: ignore
